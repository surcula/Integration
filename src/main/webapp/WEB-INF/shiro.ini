[main]
employeeRealm = be.atc.erpprojetintegration_1.security.EmployeeRealm
securityManager.realms = $employeeRealm

authc.loginUrl = /login.xhtml
authc.successUrl = /hub.xhtml
roles.unauthorizedUrl = /access-denied.xhtml
perms.unauthorizedUrl = /access-denied.xhtml


[urls]
/login.xhtml = anon
/access-denied.xhtml = authc
/javax.faces.resource/** = anon
/login-assets/** = anon
/app-assets/** = anon
/hub.xhtml = authc, perms[hub:access]
/views/roles.xhtml = authc, roles[ADMIN]
/views/role-edit.xhtml = authc, roles[ADMIN]
/views/authorizations.xhtml = authc, roles[ADMIN]
/views/company.xhtml = authc, roles[ADMIN]
/views/addresses.xhtml = authc, perms[address:read]
/views/address-edit.xhtml = authc
/views/cities-admin.xhtml = authc, perms[city:read]
/views/city-edit.xhtml = authc
/views/superiors.xhtml = authc, roles[ADMIN]
/views/superior-edit.xhtml = authc, roles[ADMIN]
/views/profile.xhtml = authc, perms[profile:read]
/views/employee-edit.xhtml = authc
/views/department-edit.xhtml = authc, roles[ADMIN]
/views/functions.xhtml = authc, perms[function:read]
/views/function-edit.xhtml = authc, roles[ADMIN]
/** = authc
