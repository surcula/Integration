<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/app-template.xhtml">
    <ui:define name="title">#{msg['accessDenied.title']} | ERP RH</ui:define>

    <ui:define name="content">
        <div class="page-heading">
            <div class="page-heading-copy">
                <span class="page-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
                <div>
                    <p class="eyebrow mb-1">#{msg['accessDenied.section']}</p>
                    <h1 class="h3 mb-1">#{msg['accessDenied.title']}</h1>
                    <p class="text-muted mb-0">#{msg['accessDenied.message']}</p>
                </div>
            </div>
            <a class="btn btn-primary" href="#{request.contextPath}/hub.xhtml">
                <i class="bi bi-house-door me-1" aria-hidden="true"></i>
                #{msg['accessDenied.back']}
            </a>
        </div>
    </ui:define>
</ui:composition>
</html>
