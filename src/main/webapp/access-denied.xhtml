<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>#{msg['common.accessDenied']}</title>
    <link rel="stylesheet" href="#{request.contextPath}/app-assets/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="#{request.contextPath}/app-assets/vendors/bootstrap-icons/bootstrap-icons.css"/>
    <link rel="stylesheet" href="#{request.contextPath}/app-assets/css/style.css"/>
</h:head>

<h:body>
    <main class="access-denied-page">
        <section class="access-denied-panel">
            <span class="access-denied-icon">
                <i class="bi bi-shield-lock" aria-hidden="true"></i>
            </span>

            <p class="eyebrow mb-2">#{msg['common.accessDenied']}</p>
            <h1 class="h3 mb-3">#{msg['accessDenied.title']}</h1>
            <p class="text-muted mb-4">#{msg['accessDenied.description']}</p>

            <h:form>
                <h:commandLink action="#{authBean.logout}" styleClass="btn btn-primary">
                    <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
                    <span>#{msg['nav.logout']}</span>
                </h:commandLink>
            </h:form>
        </section>
    </main>
</h:body>
</html>
