<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="/WEB-INF/templates/login-template.xhtml">
    <ui:define name="title">#{msg['password.change.pageTitle']}</ui:define>

    <ui:define name="content">
        <span class="login100-form-title p-b-20">
            #{msg['password.change.title']}
        </span>

        <h:form styleClass="login100-form password-change-form p-b-33 p-t-5">
            <p class="login-required-note">
                #{authBean.passwordChangeRequired
                    ? msg['password.change.subtitle']
                    : msg['password.change.voluntary.subtitle']}
            </p>

            <h:panelGroup layout="block"
                          styleClass="wrap-input100 validate-input"
                          rendered="#{not authBean.passwordChangeRequired}">
                <h:inputSecret id="currentPassword"
                               value="#{authBean.currentPassword}"
                               styleClass="input100 current-password-input"
                               pt:autocomplete="current-password"
                               pt:placeholder="#{msg['password.change.current']} *"
                               pt:data-required-message="#{msg['password.change.error.current.required']}"/>
                <span class="focus-input100" data-placeholder="&#xe80f;"></span>
            </h:panelGroup>

            <div class="wrap-input100 validate-input"
                 data-validate="#{msg['password.change.error.format']}">
                <h:inputSecret id="newPassword"
                               value="#{authBean.newPassword}"
                               styleClass="input100 new-password-input"
                               pt:autocomplete="new-password"
                               pt:placeholder="#{msg['password.change.new']} *"
                               pt:data-required-message="#{msg['password.change.error.required']}"
                               pt:data-format-message="#{msg['password.change.error.format']}"/>
                <span class="focus-input100" data-placeholder="&#xe80f;"></span>
            </div>

            <div class="wrap-input100 validate-input"
                 data-validate="#{msg['password.change.error.mismatch']}">
                <h:inputSecret id="passwordConfirmation"
                               value="#{authBean.passwordConfirmation}"
                               styleClass="input100 password-confirmation-input"
                               pt:autocomplete="new-password"
                               pt:placeholder="#{msg['password.change.confirm']} *"
                               pt:data-required-message="#{msg['password.change.error.confirmation.required']}"
                               pt:data-mismatch-message="#{msg['password.change.error.mismatch']}"/>
                <span class="focus-input100" data-placeholder="&#xe80f;"></span>
            </div>

            <p class="login-required-note">#{msg['password.change.rules']}</p>
            <h:messages globalOnly="true" layout="list" styleClass="login-error-message"/>

            <div class="container-login100-form-btn password-change-actions m-t-32">
                <h:commandButton id="changePasswordButton"
                                 styleClass="login100-form-btn password-change-button"
                                 value="#{msg['password.change.submit']}"
                                 action="#{authBean.changePassword}"/>
                <h:link outcome="/views/profile"
                        styleClass="login100-form-btn password-return-button"
                        rendered="#{not authBean.passwordChangeRequired}">
                    #{msg['password.change.back']}
                </h:link>
            </div>
        </h:form>
    </ui:define>

    <ui:define name="scripts">
        <script src="#{request.contextPath}/login-assets/js/password-change.js"></script>
    </ui:define>
</ui:composition>
</html>
