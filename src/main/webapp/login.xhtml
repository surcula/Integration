<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="/WEB-INF/templates/login-template.xhtml">

    <ui:define name="title">
        #{msg['login.pageTitle']}
    </ui:define>

    <ui:define name="content">

        <span class="login100-form-title p-b-41">
            #{msg['login.title']}
        </span>

        <h:form styleClass="login100-form validate-form p-b-33 p-t-5">

            <div class="wrap-input100 validate-input" data-validate="#{msg['login.emailRequired']}">
                <h:inputText styleClass="input100 login-email-input"
                             value="#{authBean.email}"
                             id="email"
                             pt:type="email"
                             pt:placeholder="#{msg['login.email']}"
                             pt:data-required-message="#{msg['login.emailRequired']}"
                             pt:data-invalid-message="#{msg['login.emailInvalid']}"/>
                <span class="focus-input100" data-placeholder="&#xe82a;"></span>
            </div>

            <div class="wrap-input100 validate-input" data-validate="#{msg['login.passwordRequired']}">
                <h:inputSecret styleClass="input100 login-password-input"
                               value="#{authBean.password}"
                               id="password"
                               pt:placeholder="#{msg['login.password']}"
                               pt:data-required-message="#{msg['login.passwordRequired']}"/>
                <span class="focus-input100" data-placeholder="&#xe80f;"></span>
            </div>


            <h:messages globalOnly="true"
                        layout="list"
                        styleClass="login-error-message"/>

            <div class="container-login100-form-btn m-t-32">
                <h:commandButton id="loginButton"
                                 styleClass="login100-form-btn login-button"
                                 value="#{msg['login.submit']}"
                                 action="#{authBean.login}"
                                 />
            </div>

        </h:form>

    </ui:define>

</ui:composition>
</html>
