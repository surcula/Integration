<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/app-template.xhtml">
    <ui:define name="title">#{msg['evaluations.pageTitle']}</ui:define>

    <ui:define name="content">
        <div class="page-heading">
            <div class="page-heading-copy">
                <span class="page-icon">
                    <i class="bi bi-clipboard-check"></i>
                </span>
                <div>
                    <p class="eyebrow mb-1">#{msg['evaluations.section']}</p>
                    <h1 class="h3 mb-1">#{msg['evaluations.title']}</h1>
                    <p class="text-muted mb-0">#{msg['evaluations.subtitle']}</p>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="table-responsive">
                <h:form id="evaluationsForm">
                    <p:dataTable value="#{evaluationsBean.evaluations}"
                                 var="evaluation"
                                 widgetVar="evaluationsTable"
                                 styleClass="table align-middle mb-0 erp-data-table"
                                 paginator="true"
                                 rows="10"
                                 rowsPerPageTemplate="10,25,50"
                                 paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {CurrentPageReport} {RowsPerPageDropdown}"
                                 currentPageReportTemplate="#{msg['common.itemsPerPage']}"
                                 paginatorPosition="both"
                                 emptyMessage="#{msg['evaluations.empty']}">

                        <f:facet name="header">
                            <div class="d-flex justify-content-end">
                                <span class="p-input-icon-left employee-global-search">
                                    <i class="bi bi-search"></i>
                                    <p:inputText id="globalFilter"
                                                 styleClass="form-control"
                                                 onkeyup="PF('evaluationsTable').filter()"
                                                 placeholder="#{msg['evaluations.search']}"/>
                                </span>
                            </div>
                        </f:facet>

                        <p:column headerText="#{msg['evaluations.name']}"
                                  sortBy="#{evaluation.evaluationName}"
                                  filterBy="#{evaluation.evaluationName}"
                                  filterMatchMode="contains"
                                  filterStyle="display:none">
                            <strong>#{evaluation.evaluationName}</strong>
                        </p:column>

                        <p:column headerText="#{msg['evaluations.date']}"
                                  sortBy="#{evaluation.evaluationDate}">
                            #{evaluation.evaluationDate}
                        </p:column>

                        <p:column headerText="#{msg['evaluations.globalScore']}"
                                  sortBy="#{evaluation.globalScore}">
                            #{evaluationsBean.formatScore(evaluation.globalScore)}
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
</html>
