<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html">

<ui:composition template="/WEB-INF/templates/app-template.xhtml">

    <ui:define name="title">
        Profil
    </ui:define>

    <ui:define name="content">


                <div class="page-heading">
                    <div class="page-heading-copy">
                        <span class="badge text-bg-primary">#{authBean.connectedEmployeeRoleName}</span>
                        <div>
                            <p class="eyebrow mb-1">Account</p>
                            <h1 class="h3 mb-1">Profile</h1>
                            <p class="text-muted mb-0">Manage your personal details</p>
                        </div>
                    </div>
                    <h:messages globalOnly="true" styleClass="text-danger"/>
                </div>

                <section class="row g-3">
                    <div class="col-12 col-xl-4">
                        <div class="panel h-100 text-center profile-card">
                            <h2 class="h5 mt-3 mb-1">#{authBean.connectedEmployeeFullName}</h2>
                            <p class="text-muted mb-3">#{authBean.connectedEmployeeRoleName}</p>

                            <div class="info-list mt-4 text-start">
                                <div>
                                    <span>Email</span>
                                    <strong>#{authBean.connectedEmployee.email}</strong>
                                </div>
                                <div>
                                    <span>Department</span>
                                    <strong>-</strong>
                                </div>
                            </div>
                        </div>
                    </div>

                </section>


    </ui:define>

</ui:composition>
</html>
